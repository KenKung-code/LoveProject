<!DOCTYPE html>
<html lang="th">
<meta charset="UTF-8">
<meta name="viewport"
content="width+device-width, initial-scale=1.0">
<title>Do You Love Me? ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffe4ec;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{ font-size:48px;
margin-bottom:40px;
color:#ff4d88;
}

button{
    width:130px;
    height:60px;
    border:none;
    border-radius:50px;
    font-size:24px;
    cursor:pointer;
    transition:.2s;
}

#yesBtn{
    background:#ff4d88;
    color:white;
}

#noBtn{
    background:#888;
    color:white;
    position:absolute;
}
</style>

</head>

<body>

<div class="container">

<h1>Do You Love Me? ❤️</h1>

<button id="yesBtn">YES</button>

<button id="noBtn">NO</button>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

//ปุ่มYES ไปหน้าถัดไป
yesBtn.onclick = function(){
    window.location.href="yes.html";
};

// ฟังก์ชันสุ่มตำแหน่ง
function moveButton(){

    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

//เอาเมาส์ไปชี้แล้วหนี
noBtn.addEventListener("mouseover", moveButton);

// มือถือกดแล้วหนี
noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveButton();
});

</script>

</body>
</html>
